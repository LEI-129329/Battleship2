# 129329 - Luís Aguiar de Sousa
# Large Class / God Class
version: "1.0"

profile:
  base:
    name: empty
  inspections:
    # ID da inspeção no perfil IntelliJ/Qodana Community: ClassComplexity
    # ID apresentado pela Inspectopedia para supressão: OverlyComplexClass
    # A opção m_limit define o limite máximo de complexidade ciclomática total da classe.
    - inspection: ClassComplexity
      enabled: true
      options:
        m_limit: 46
