# 129329 - Large Class / God Class
version: "1.0"

profile:
  base:
    name: empty
  inspections:
    # ID da inspeção no Qodana/Inspectopedia: OverlyComplexClass
    # ID interno apresentado no IntelliJ: ClassComplexity
    # A opção m_limit define o limite máximo de complexidade ciclomática total da classe.
    - inspection: OverlyComplexClass
      enabled: true
      options:
        m_limit: 46
