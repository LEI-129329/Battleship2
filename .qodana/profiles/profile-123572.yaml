# 123572 - Nelssy Pina
version: "1.0"

profile:
  base:
    name: empty
  inspections:

    # 1. Deteção de métodos demasiado longos
    - inspection: OverlyLongMethod
      enabled: true
      options:
        m_limit: 65

    # 2. Deteção de métodos demasiado complexos
    - inspection: OverlyComplexMethod
      enabled: true
      options:
        m_limit: 3

    # 3. Deteção de métodos demasiado aninhados
    - inspection: OverlyNestedMethod
      enabled: true
      options:
        m_limit: 2
