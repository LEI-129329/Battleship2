name: Checkstyle Constant Gate 101283

on:
  pull_request:
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          checkstyle_config: checkstyle/checkstyle-101283.xml