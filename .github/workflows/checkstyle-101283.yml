# 101283 - André Durães
name: Checkstyle Constant Gate 101283

on:
  pull_request:
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Checkstyle with Maven
        run: |
          mvn checkstyle:check -Dcheckstyle.config.location=checkstyle/checkstyle-101283.xml