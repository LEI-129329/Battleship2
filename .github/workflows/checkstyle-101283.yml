# 101283 - André Durães
name: Checkstyle Constant Gate 101283

on:
  pull_request:
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkstyle
        uses: sokunmin/checkstyle-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          checkstyle_config: checkstyle/checkstyle-101283.xml
          tool_version: '10.12.5'