# 101283 - André Durães

name: Qodana smell gate 101283

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-101283.yaml
          upload-result: true

