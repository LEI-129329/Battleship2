name: Checkstyle 113044

on:
        push:
          branches: [ "checkstyle", "main" ]
        pull_request:
          branches: [ "main" ]

jobs:
        checkstyle:
                runs-on: ubuntu-latest

                steps:
                        - name: Checkout repository
                          uses: actions/checkout@v4

                        - name: Set up JDK 25
                          uses: actions/setup-java@v4
                          with:
                                distribution: 'temurin'
                                java-version: '25'

                        - name: Run Checkstyle validation
                          run: mvn validate